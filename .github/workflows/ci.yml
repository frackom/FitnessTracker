# CI workflow based on official GitHub Actions documentation:
# https://docs.github.com/en/actions/guides/building-and-testing-net
# https://docs.github.com/en/actions/guides/building-and-testing-nodejs

name: CI

on:
  push:
    branches:
      - main
      - backend
      - frontend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend tests
        run: >
          dotnet restore
          backend/FitnessTracker.Api.Tests/FitnessTracker.Api.Tests.csproj

      - name: Build backend tests
        run: >
          dotnet build
          backend/FitnessTracker.Api.Tests/FitnessTracker.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          backend/FitnessTracker.Api.Tests/FitnessTracker.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: frontend
          install: false
          start: npm run preview -- --host 0.0.0.0 --port 5173
          wait-on: "http://127.0.0.1:5173"
          browser: chrome