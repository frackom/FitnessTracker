# CI workflow based on official GitHub Actions documentation:
# https://docs.github.com/en/actions/guides/building-and-testing-net
# https://docs.github.com/en/actions/guides/building-and-testing-nodejs

name: CI

on:
  push:
    branches:
      - main
      - backend
      - frontend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Build ASP.NET backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend dependencies
        run: dotnet restore backend/FitnessTracker.Api.csproj

      - name: Build backend
        run: >
          dotnet build backend/FitnessTracker.Api.csproj
          --configuration Release
          --no-restore

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build